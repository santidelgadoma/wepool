<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WEPOOL — sin conexión</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f8fc;
    color: #1c1e29;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 360px; }
  img { width: 72px; height: 72px; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { color: #5b5f73; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #3358ff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>
      No se pudo cargar WEPOOL porque no hay internet en este momento.
      Publicar o confirmar un viaje necesita conexión — inténtalo de nuevo
      cuando la recuperes.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
